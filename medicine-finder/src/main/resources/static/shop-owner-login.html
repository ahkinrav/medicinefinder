
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shop Owner Login | MedSpot</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="panel auth-panel">
    <h1>Shop Owner Login</h1>

    <form id="shop-login-form">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" required>

      <label for="password">Password</label>
      <input id="password" name="password"
             type="password" required>

      <button class="primary" type="submit">Login</button>
      <p id="message" role="status"></p>
    </form>

    <p>New shop owner?
      <a href="/shop-owner-register.html">Register your pharmacy</a>
    </p>
    <p><a href="/">Back to Home</a></p>
  </main>

  <script>
    document.getElementById("shop-login-form")
      .addEventListener("submit", async function (event) {
        event.preventDefault();

        const data = Object.fromEntries(new FormData(this));
        data.role = "SHOP_OWNER";
        const message = document.getElementById("message");

        try {
          const response = await fetch("/api/auth/login", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify(data)
          });

          const result = await response.json();
          message.textContent = result.message ||
            (response.ok ? "Login successful" : "Login failed");

          if (response.ok && result.redirectUrl) {
            window.location.href = result.redirectUrl;
          }
        } catch (error) {
          message.textContent = "Server connection failed. Please try again.";
        }
      });
  </script>
</body>
</html>
