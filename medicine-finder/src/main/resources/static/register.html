
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Customer Registration | MedSpot</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="panel auth-panel">
    <h1>Customer Registration</h1>
    <p>Create your MedSpot account.</p>

    <form id="customer-register-form">
      <label for="name">Full name</label>
      <input id="name" name="name" required>

      <label for="email">Email</label>
      <input id="email" name="email" type="email" required>

      <label for="phone">Mobile number</label>
      <input id="phone" name="phone" type="tel" required>

      <label for="password">Password</label>
      <input id="password" name="password"
             type="password" minlength="8" required>

      <button class="primary" type="submit">Register</button>
      <p id="message" role="status"></p>
    </form>

    <p>Already registered? <a href="/login.html">Login</a></p>
    <p><a href="/">Back to Home</a></p>
  </main>

  <script>
    
  document.getElementById("customer-register-form")
    .addEventListener("submit", async function (event) {
      event.preventDefault();

      const form = this;
      const data = Object.fromEntries(new FormData(form));
      const message = document.getElementById("message");
      const button = form.querySelector('button[type="submit"]');

      message.textContent = "Registering...";
      button.disabled = true;

      try {
        const response = await fetch("/api/auth/register", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(data)
        });

        const result = await response.json();

        message.textContent = result.message ||
          (response.ok ? "Registration successful!" : "Registration failed.");

        if (response.ok) {
          form.reset();
          setTimeout(() => {
            window.location.href = result.redirectUrl || "/login.html";
          }, 1200);
        }
      } catch (error) {
        message.textContent =
          "Server connection failed. Check that MedSpot is running.";
      } finally {
        button.disabled = false;
      }
    });


  </script>
</body>
</html>
