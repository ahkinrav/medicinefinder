server.port=8080

# In-memory database (data resets on restart). Swap for MySQL/PostgreSQL in production.
spring.datasource.url=jdbc:h2:mem:medfinder
spring.jpa.hibernate.ddl-auto=create
spring.jpa.open-in-view=false
spring.h2.console.enabled=true

# Sample data is generated around this point. Change it to your own area.
app.seed.center-lat=10.93175966508971
app.seed.center-lng=78.74365101845653
